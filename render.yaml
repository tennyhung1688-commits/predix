# ============================================================
# Render Blueprint 配置
# 在 Render Dashboard → Blueprints 中连接 GitHub 仓库即可一键部署
# ============================================================

services:
  - type: web
    name: predix-backend
    env: node
    region: singapore  # 新加坡节点，亚洲访问快
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: bash render-start.sh
    plan: free          # 免费计划
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--dns-result-order=ipv4first"
      - key: PORT
        value: "10000"

      # ---- 数据库（Aiven PostgreSQL Free） ----
      # ⚠️ 请在 Render Dashboard → predix-backend → Environment 中手动设置
      # 连接字符串格式: postgres://avnadmin:密码@pg-xxx.g.aivencloud.com:24940/defaultdb?sslmode=require
      - key: DATABASE_URL
        sync: false

      # ---- JWT 密钥（自己在终端生成） ----
      # node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      - key: JWT_SECRET
        generateValue: true  # Render 会自动生成一个随机值

      # ---- CORS 允许的前端域名 ----
      - key: CORS_ORIGIN
        value: https://predix.eu.cc

      # ---- Polymarket 配置 ----
      - key: FEE_RATE
        value: "0.035"
      - key: POLYMARKET_GAMMA_API
        value: https://gamma-api.polymarket.com
      - key: POLYMARKET_CLOB_API
        value: https://clob.polymarket.com
      - key: POLYMARKET_DATA_API
        value: https://data-api.polymarket.com
      - key: POLYMARKET_WS
        value: wss://ws-subscriptions-clob.polymarket.com/ws/market

      # ---- 平台钱包（从 .env 复制真实值） ----
      - key: PLATFORM_WALLET_ADDRESS
        value: "0x8db0B1651ba9D83F5Ba1db5d6F2c01306E1CFcc6"
      - key: PLATFORM_WALLET_PRIVATE_KEY
        value: "0x47b555878b67b8f8432657be3319a8d5f1d6d85160c8de170b1d076f8e185ce1"
      - key: PLATFORM_POLY_API_KEY
        value: "59c52a8b-05ea-ddec-c61f-eb65f109b9e6"
      - key: PLATFORM_POLY_API_SECRET
        value: "BRIUb6lej_m8ieA-sSAr0FJLsaakPkFMyvQrn8naQuE="
      - key: PLATFORM_POLY_PASSPHRASE
        value: "13a0868f3898dae122d2681f284ef7985b2a0df2df2be54aca2613e67d5c6e04"
      - key: PLATFORM_SIGNATURE_TYPE
        value: "0"
      - key: PLATFORM_FEE_MODE
        value: spread
      - key: MIN_WITHDRAW_AMOUNT
        value: "10"
      - key: TRUST_PROXY
        value: "true"

      # ---- PolygonScan API（余额查询） ----
      - key: POLYGONSCAN_API_KEY
        value: "8BTAZ9BFWJT693I2KSIK2SYKZASQ45U8ZP"

      # ---- Polymarket Relayer（代理钱包 Gas 代付） ----
      - key: RELAYER_API_KEY
        value: "0x0b1d787401bb283b18e5c73accfd8c8f41269b56caf6e5e5e75e4ddba828f6db"
      - key: RELAYER_API_KEY_ADDRESS
        value: "0x8db0B1651ba9D83F5Ba1db5d6F2c01306E1CFcc6"

      # ---- POLY_1271 存款钱包地址 ----
      - key: PLATFORM_FUNDER_ADDRESS
        value: "0xb9d36bb4d8effa704cbfdd4be0d204cb404a3062"
