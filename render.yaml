# ============================================================
# Render Blueprint 配置
# 在 Render Dashboard → Blueprints 中连接 GitHub 仓库即可一键部署
# ============================================================

services:
  - type: web
    name: predix-backend
    env: node
    region: singapore  # 新加坡节点，亚洲访问快
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: bash render-start.sh
    plan: free          # 免费计划
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"

      # ---- 数据库（改为你在 Supabase 上创建的连接串） ----
      # 从 Supabase Dashboard → Project Settings → Database → Connection string
      # 注意：要用 Session pooler 的连接串（端口 6543）
      - key: DATABASE_URL
        sync: false
        value: postgresql://your-supabase-db-url

      # ---- JWT 密钥（自己在终端生成） ----
      # node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      - key: JWT_SECRET
        sync: false
        generateValue: true  # Render 会自动生成一个随机值

      # ---- CORS 允许的前端域名 ----
      - key: CORS_ORIGIN
        value: https://predix.apay.eu.cc

      # ---- Polymarket 配置 ----
      - key: FEE_RATE
        value: "0.005"
      - key: POLYMARKET_GAMMA_API
        value: https://gamma-api.polymarket.com
      - key: POLYMARKET_CLOB_API
        value: https://clob.polymarket.com
      - key: POLYMARKET_DATA_API
        value: https://data-api.polymarket.com
      - key: POLYMARKET_WS
        value: wss://ws-subscriptions-clob.polymarket.com/ws/market

      # ---- 平台钱包（从 .env 复制真实值） ----
      - key: PLATFORM_WALLET_ADDRESS
        sync: false
      - key: PLATFORM_WALLET_PRIVATE_KEY
        sync: false
      - key: PLATFORM_POLY_API_KEY
        sync: false
      - key: PLATFORM_POLY_API_SECRET
        sync: false
      - key: PLATFORM_POLY_PASSPHRASE
        sync: false
      - key: PLATFORM_SIGNATURE_TYPE
        value: "0"
      - key: PLATFORM_FEE_MODE
        value: spread
      - key: MIN_WITHDRAW_AMOUNT
        value: "10"
      - key: TRUST_PROXY
        value: "true"
